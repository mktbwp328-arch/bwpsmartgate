<style>
:root{
  --navy:#0F2A52; --navy2:#0B1F3F; --blue:#1D6AE5; --blue-d:#1554BC;
  --green:#16A34A; --orange:#F97316; --purple:#7C3AED; --red:#DC2626;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E2E8F0; --line2:#F1F5F9;
  --text:#0F172A; --muted:#64748B; --faint:#94A3B8;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;font-size:14px;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid #CBD5E1;border-radius:9px;padding:10px 13px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803D}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn-navy{background:var(--navy);color:#fff}
.badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;display:inline-block}
.b-green{background:#DCFCE7;color:#15803D}.b-yellow{background:#FEF9C3;color:#A16207}
.b-blue{background:#EFF5FF;color:#1D6AE5}.b-red{background:#FEE2E2;color:#B91C1C}
.b-purple{background:#F3E8FF;color:#7C3AED}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.hidden{display:none!important}
label{font-size:13px;font-weight:600;color:#334155;display:block;margin:0 0 5px}
.field{margin-bottom:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--line2);text-align:left;padding:11px 14px;font-size:12.5px;color:#475569}
td{padding:11px 14px;border-top:1px solid var(--line2)}
/* layout */
#app{display:flex;min-height:100vh}
#sidebar{width:230px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.side-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;font-size:14px;color:#C3D4EE;cursor:pointer;margin:2px 12px}
.side-item:hover{background:rgba(255,255,255,.08)}
.side-item.active{background:var(--blue);color:#fff;font-weight:600}
#main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:#fff;border-bottom:1px solid var(--line)}
.page{padding:22px 26px}
.stat{border-radius:12px;padding:18px 20px;color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}#sidebar{display:none}#mobilenav{display:flex!important}}
#mobilenav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px 10px;justify-content:space-around}
#toast{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#0F172A;color:#fff;border-radius:10px;padding:12px 18px;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fadein .2s}
.toast.err{background:#B91C1C}.toast.ok{background:#15803D}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(8,20,42,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.gps-pill{display:flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.gps-ok{background:#DCFCE7;border:1px solid #86EFAC;color:#15803D}
.gps-bad{background:#FEE2E2;border:1px solid #FCA5A5;color:#B91C1C}
.gps-wait{background:#FEF9C3;border:1px solid #FDE047;color:#A16207}
.scan-frame{border-radius:14px;background:linear-gradient(160deg,#0B1F3F,#17335E);min-height:300px;position:relative;display:flex;align-items:center;justify-content:center;color:#A7C4EE;overflow:hidden}
.tab2{display:flex;gap:12px;margin-bottom:16px}
.tab2 button{flex-grow:1;padding:13px;font-size:15px;font-weight:700;border-radius:10px}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
</style>
</head>

const SB_KEY='sb_publishable_xtX6DPBW88CB1SOdYvBwMw_hYjz9pJX';
let sbOnline=false;
async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',
    ...(opts.headers||{})}});
  if(!res.ok)throw new Error('sb '+res.status+' '+await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}
let sbPending=0;
function sbPush(key,data){
  if(!sbOnline)return;
  sbPending++;
  sbFetch('smartgate_store?on_conflict=key',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key,data,updated_at:new Date().toISOString()}])
  }).catch(e=>{console.warn('sync fail',e);toast('ซิงก์ไม่สำเร็จ — ข้อมูลถูกเก็บในเครื่องไว้ก่อน','err')})
    .finally(()=>{sbPending--});
}
async function sbLoad(){
  if(sbPending>0)return; // กำลังอัปโหลดอยู่ — อย่าเพิ่งดึงทับ (กันข้อมูลที่เพิ่งบันทึกหาย)
  try{
    const rows=await sbFetch('smartgate_store?select=key,data');
    sbOnline=true;
    const m={};rows.forEach(r=>m[r.key]=r.data);
    const j=JSON.stringify(m);
    if(j===window._lastSync)return; // ไม่มีอะไรเปลี่ยน — ไม่ต้อง re-render (กันฟอร์มที่กำลังกรอกหาย)
    window._lastSync=j;
    // มีข้อมูลบนคลาวด์ → ใช้ของคลาวด์ / ยังไม่มี → อัปโหลดข้อมูลเครื่องนี้ขึ้นไปตั้งต้น
    if(m.employees)employees=m.employees;else sbPush('employees',employees);
    if(m.records)records=m.records;else sbPush('records',records);
    if(m.visitors)visitors=m.visitors;else sbPush('visitors',visitors);
    if(m.settings)settings={...settings,...m.settings};else sbPush('settings',settings);
    save('employees',employees);save('records',records);save('visitors',visitors);save('settings',settings);
    if(!$('app').classList.contains('hidden'))render();
    console.log('Supabase sync: online');
  }catch(e){sbOnline=false;console.warn('Supabase offline — ใช้ข้อมูลในเครื่อง:',e.message)}
  const dot=$('cloud-dot');if(dot){dot.style.background=sbOnline?'#22C55E':'#EAB308';dot.title=sbOnline?'ซิงก์กับ Supabase แล้ว':'ออฟไลน์ — ข้อมูลอยู่ในเครื่องเท่านั้น'}
}
setInterval(()=>{if(sbOnline)sbLoad()},30000); // ดึงข้อมูลใหม่ทุก 30 วิ (คนอื่นแก้ก็เห็น)

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime=()=>new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const today=()=>new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const normPhone=p=>String(p||'').replace(/\D/g,'');
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;$('toast').appendChild(t);setTimeout(()=>t.remove(),3500)}
function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dg=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ================= GPS ================= */
let gps={ok:false,dist:null,msg:'กำลังหาตำแหน่ง...'};
function updateGpsUI(){
  const el=$('gps-indicator');if(!el)return;
  if(settings.simulate){
    gps.ok=settings.simInRange;gps.dist=settings.simInRange?23:120;
    el.className='gps-pill '+(gps.ok?'gps-ok':'gps-bad');
    el.textContent=(gps.ok?'📍 อยู่ในรัศมี · ':'⛔ นอกรัศมี · ')+`ห่างหมุด ${gps.dist} ม. (จำลอง)`;
    return;
  }
  if(!settings.lat){el.className='gps-pill gps-wait';el.textContent='📍 ยังไม่ปักหมุดบริษัท — ไปที่ตั้งค่า';gps.ok=false;return}
  if(!navigator.geolocation){el.className='gps-pill gps-bad';el.textContent='⛔ เบราว์เซอร์ไม่รองรับ GPS';gps.ok=false;return}
  navigator.geolocation.getCurrentPosition(p=>{
    const d=Math.round(haversine(p.coords.latitude,p.coords.longitude,settings.lat,settings.lng));
    gps.dist=d;gps.ok=d<=settings.radius;
    el.className='gps-pill '+(gps.ok?'gps-ok':'gps-bad');
    el.textContent=(gps.ok?'📍 อยู่ในรัศมี · ':'⛔ นอกรัศมี · ')+`ห่างหมุด ${d} ม. (ไม่เกิน ${settings.radius} ม.)`;
  },e=>{el.className='gps-pill gps-bad';el.textContent='⛔ อ่านตำแหน่งไม่ได้ — เปิดสิทธิ์ Location';gps.ok=false});
}
setInterval(updateGpsUI,10000);

  }
  const p=normPhone($('login-phone').value);
  const box=$('login-error');box.classList.add('hidden');
  if(!p){toast('กรอกเบอร์โทรก่อน','err');return}
  const found=employees.find(e=>normPhone(e.phone)===p);

    box.classList.remove('hidden');toast('ไม่พบเบอร์นี้ในข้อมูลพนักงาน','err');return;

  $('otp-box').classList.remove('hidden');$('btn-request-otp').classList.add('hidden');$('btn-login').classList.remove('hidden');
  $('otp-hint').textContent=`(เดโม่ — รหัสคือ ${currentOtp})`;
  toast('ส่ง OTP แล้ว (เดโม่: แสดงบนหน้าจอ)','ok');
};

  session={code:pendingEmp.code};persist();enterApp();
};

  if(!code&&employees.some(e=>e.code===v('f-code'))){toast('รหัสนี้มีอยู่แล้ว','err');return}
  const data={code:v('f-code'),name:v('f-name'),dept:v('f-dept'),pos:v('f-pos'),phone:v('f-phone'),active:true};
  if(code){Object.assign(employees.find(e=>e.code===code),data)}else{employees.push(data)}
  persist();closeModal();renderEmpTable();toast('บันทึกแล้ว — สถานะ Active พร้อมใช้งานที่จุดสแกน','ok');
}
function importCsv(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  let retried=false;
  rd.onload=()=>{
    // CSV จาก Excel ไทยมักเป็นรหัส windows-874 — ถ้าอ่านแล้วตัวอักษรเพี้ยน (�) ให้อ่านใหม่
    if(!retried&&rd.result.includes('�')){retried=true;rd.readAsText(f,'windows-874');return}
    let n=0;
    rd.result.split(/\r?\n/).forEach(line=>{
      const c=line.split(',').map(s=>s.trim());
      if(c.length>=2&&c[0]&&!/รหัส/.test(c[0])&&!employees.some(e=>e.code===c[0])){
        employees.push({code:c[0],name:c[1]||'',dept:c[2]||'',pos:c[3]||'',phone:c[4]||'',active:true});n++;
      }});
    persist();renderEmpTable();toast(`นำเข้าแล้ว ${n} รายการ`,'ok');inp.value='';
  };
  rd.readAsText(f);
}

function doScan(){

  const box=$('scan-result');
  const fail=(t,d)=>{box.innerHTML=`<div style="text-align:center;padding:30px 10px"><div style="width:70px;height:70px;border-radius:50%;background:#FEE2E2;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px">✕</div><div style="font-size:19px;font-weight:700;color:var(--red)">${t}</div><div style="color:var(--muted);font-size:13.5px;margin-top:6px">${d}</div></div>`};

  const d=today();
  let rec=records.find(r=>r.code===emp.code&&r.date===d&&!r.out);
  if(scanMode==='in'){
    if(rec){fail('เช็คอินซ้ำ',`${esc(emp.name)} เช็คอินแล้วเมื่อ ${rec.in} — หากต้องการออกให้เลือกแท็บ "ออก"`);return}
    rec={type:'emp',code:emp.code,name:emp.name,dept:emp.dept,in:nowTime(),out:null,date:d};records.push(rec);
  }else{
    if(!rec){fail('ยังไม่ได้เช็คอิน',`${esc(emp.name)} ยังไม่มีรายการเข้าในวันนี้`);return}

let idcardData=null,vphotoData=null;
function onVPhoto(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    // ย่อรูปก่อนเก็บ (localStorage มีพื้นที่จำกัด)
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');const s=Math.min(1,320/img.width);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      vphotoData=c.toDataURL('image/jpeg',0.75);
      $('vphoto-box').innerHTML=`<img src="${vphotoData}" style="width:100%;height:100%;object-fit:cover">`;
      toast('บันทึกรูปผู้มาติดต่อแล้ว','ok');
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function onIdCard(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{idcardData=rd.result;const img=$('idcard-preview');img.src=idcardData;img.classList.remove('hidden');
    // จำลอง OCR
    if(!$('v-name').value)$('v-name').value='นายสมชาย ใจดี';
    if(!$('v-addr').value)$('v-addr').value='99/1 ถ.พหลโยธิน เขตจตุจักร กรุงเทพฯ 10900';

    toast('OCR (จำลอง) เติมชื่อและที่อยู่แล้ว','ok')};
  rd.readAsDataURL(f);
}

let reportTab='emp';
function setReportTab(t){reportTab=t;render()}
function rTabBtn(id,label){return `<button onclick="setReportTab('${id}')" style="flex-grow:1;padding:11px 16px;border-radius:9px;font-size:13.5px;font-weight:${reportTab===id?700:500};background:${reportTab===id?'var(--blue)':'transparent'};color:${reportTab===id?'#fff':'var(--muted)'}">${label}</button>`}
function pageReport(){
  return `<div class="page">
    <div class="card" style="display:flex;gap:6px;padding:6px;margin-bottom:16px;flex-wrap:wrap">
      ${rTabBtn('emp','ประวัติเข้า-ออก')}${rTabBtn('vis','รายงานผู้มาติดต่อ')}${rTabBtn('daily','สรุปรายวัน')}${rTabBtn('export','ส่งออกข้อมูล')}
    </div>
    ${({emp:reportEmp,vis:reportVis,daily:reportDaily,export:reportExport})[reportTab]()}
  </div>`;
}
function reportEmp(){
  const rows=records.slice().reverse();
  window._empRows=rows;
  return `<div class="card" style="overflow-x:auto"><table>
    <tr><th>วันที่</th><th>รหัส</th><th>ชื่อ - นามสกุล</th><th>แผนก</th><th>เวลาเข้า</th><th>เวลาออก</th><th>สถานะ</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.date)}</td><td style="color:var(--blue);font-weight:600">${esc(r.code)}</td><td style="font-weight:600">${esc(r.name)}</td>
      <td>${esc(r.dept)}</td><td>${r.in||'-'}</td><td>${r.out||'-'}</td>
      <td><span class="badge ${r.out?'b-green':'b-blue'}">${r.out?'ปกติ':'อยู่ในอาคาร'}</span></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--faint);padding:30px">ยังไม่มีข้อมูล</td></tr>'}
  </table></div>`;
}
function reportVis(){
  const rows=visitors.slice().reverse();
  return `<div class="card" style="overflow-x:auto"><table>
    <tr><th>วันที่</th><th>ชื่อ - นามสกุล</th><th>บริษัท</th><th>พบใคร / แผนก</th><th>วัตถุประสงค์</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr>
    ${rows.map(v=>`<tr><td>${esc(v.date)}</td><td style="font-weight:600">${esc(v.name)}</td><td>${esc(v.company||'-')}</td>
      <td>${esc(v.contactName)}<div style="font-size:11.5px;color:var(--faint)">${esc(v.dept)}</div></td><td>${esc(v.purpose||'-')}</td>
      <td>${v.timeIn||'-'}</td><td>${v.timeOut||'-'}</td>
      <td><span class="badge ${v.status==='ออกแล้ว'?'b-green':v.status==='รออนุมัติออก'?'b-yellow':'b-blue'}">${esc(v.status)}</span></td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--faint);padding:30px">ยังไม่มีข้อมูล</td></tr>'}
  </table></div>`;
}
function reportDaily(){
  const days={};
  records.forEach(r=>{const d=days[r.date]=days[r.date]||{ins:0,outs:0,late:0,inside:0,vis:0};d.ins++;if(r.out)d.outs++;else d.inside++;if(r.in&&r.in>'08:30')d.late++});
  visitors.forEach(v=>{const d=days[v.date]=days[v.date]||{ins:0,outs:0,late:0,inside:0,vis:0};d.vis++});
  const keys=Object.keys(days).reverse();
  return `<div class="card" style="overflow-x:auto"><table>
    <tr><th>วันที่</th><th>เช็คอิน (ครั้ง)</th><th>เช็คเอาต์ (ครั้ง)</th><th>มาสาย (หลัง 08:30)</th><th>ยังอยู่ในอาคาร</th><th>ผู้มาติดต่อ</th></tr>
    ${keys.map(k=>{const d=days[k];return `<tr><td style="font-weight:600">${esc(k)}</td><td>${d.ins}</td><td>${d.outs}</td>
      <td>${d.late?`<span class="badge b-yellow">${d.late} คน</span>`:'-'}</td>
      <td>${d.inside?`<span class="badge b-blue">${d.inside} คน</span>`:'-'}</td><td>${d.vis||'-'}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--faint);padding:30px">ยังไม่มีข้อมูล</td></tr>'}
  </table></div>`;
}
function reportExport(){
  return `<div class="grid2">
    <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:28px">🧑‍💼</div><div style="font-weight:700">ประวัติเข้า-ออกพนักงาน</div>
      <div style="font-size:12.5px;color:var(--muted)">${records.length} รายการ · วันที่, รหัส, ชื่อ, แผนก, เวลาเข้า-ออก</div>
      <button class="btn-green" onclick="exportCsv('emp')">⬇️ ส่งออก CSV</button>
    </div>
    <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:28px">🪪</div><div style="font-weight:700">รายงานผู้มาติดต่อ</div>
      <div style="font-size:12.5px;color:var(--muted)">${visitors.length} รายการ · ชื่อ, บริษัท, ผู้ถูกติดต่อ, เวลาเข้า-ออก, สถานะ</div>
      <button class="btn-green" onclick="exportCsv('vis')">⬇️ ส่งออก CSV</button>
    </div>
  </div>`;
}
function exportCsv(kind){
  let head,lines,fname;
  if(kind==='vis'){
    head='วันที่,ชื่อ,บริษัท,ผู้ถูกติดต่อ,แผนก,วัตถุประสงค์,เวลาเข้า,เวลาออก,สถานะ';
    lines=visitors.map(v=>[v.date,v.name,v.company||'',v.contactName,v.dept,v.purpose||'',v.timeIn||'',v.timeOut||'',v.status]);
    fname='bwp-visitors.csv';
  }else{
    head='วันที่,รหัสพนักงาน,ชื่อ,แผนก,เวลาเข้า,เวลาออก,สถานะ';
    lines=records.map(r=>[r.date,r.code,r.name,r.dept,r.in||'',r.out||'',r.out?'ปกติ':'อยู่ในอาคาร']);
    fname='bwp-attendance.csv';
  }
  const csv='﻿'+[head,...lines.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fname;a.click();
}

/* ================= SETTINGS ================= */
function pageSettings(){
  return `<div class="page"><div class="card" style="padding:22px;max-width:640px">
    <div style="font-weight:700;margin-bottom:16px">🏢 ข้อมูลบริษัท</div>
    <div class="field"><label>ชื่อบริษัท</label><input id="s-company" value="${esc(settings.company||'')}" placeholder="เช่น บริษัท สมาร์ทเกท จำกัด"></div>
    <div class="field"><label>ที่อยู่บริษัท</label><textarea id="s-address" rows="2" placeholder="เช่น 99 ถ.พหลโยธิน แขวงจตุจักร เขตจตุจักร กรุงเทพฯ 10900">${esc(settings.address||'')}</textarea></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px">
      <button class="btn-navy" onclick="geocodeAddress()">🔎 ปักหมุดจากที่อยู่นี้</button>
      <span id="geo-status" style="font-size:12.5px;color:var(--muted)"></span>
    </div>
    <div style="border-top:1px solid var(--line2);padding-top:16px;font-weight:700;margin-bottom:14px">📍 หมุดบริษัท &amp; รัศมีสแกน</div>
    <div class="grid2">
      <div class="field"><label>Latitude</label><input id="s-lat" value="${settings.lat??''}" placeholder="เช่น 13.7563"></div>
      <div class="field"><label>Longitude</label><input id="s-lng" value="${settings.lng??''}" placeholder="เช่น 100.5018"></div>
    </div>
    <div class="field"><label>รัศมีที่อนุญาต (เมตร)</label><input id="s-radius" type="number" value="${settings.radius}"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
      <button class="btn-ghost" onclick="pinHere()">📌 ใช้ตำแหน่งปัจจุบันเป็นหมุดบริษัท</button>
      <button class="btn-blue" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      ${settings.lat?`<a href="https://www.google.com/maps/search/?api=1&query=${settings.lat},${settings.lng}" target="_blank" rel="noopener" style="font-size:13px;font-weight:600">🗺️ ดูหมุดใน Google Maps</a>`:''}
    </div>
    <div style="border-top:1px solid var(--line2);padding-top:16px">
      <div style="font-weight:700;margin-bottom:10px">โหมดจำลอง GPS (สำหรับทดสอบ)</div>
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer"><input type="checkbox" style="width:auto" ${settings.simulate?'checked':''} onchange="settings.simulate=this.checked;persist();render()"> เปิดโหมดจำลอง (ไม่ใช้ GPS จริง)</label>
      ${settings.simulate?`<div style="display:flex;gap:10px;margin-top:10px">
        <button class="${settings.simInRange?'btn-green':'btn-ghost'}" onclick="settings.simInRange=true;persist();render()">จำลอง: อยู่ในรัศมี (23 ม.)</button>
        <button class="${!settings.simInRange?'btn-blue':'btn-ghost'}" style="${!settings.simInRange?'background:var(--red)':''}" onclick="settings.simInRange=false;persist();render()">จำลอง: นอกรัศมี (120 ม.)</button>
      </div>`:''}
    </div>
    <div style="border-top:1px solid var(--line2);padding-top:16px;margin-top:16px">
      <button class="btn-ghost" style="color:var(--red)" onclick="if(confirm('ล้างข้อมูลทดลองทั้งหมด?')){localStorage.clear();location.reload()}">🗑️ ล้างข้อมูลทดลองทั้งหมด</button>
    </div>
  </div></div>`;
}
function pinHere(){
  if(!navigator.geolocation){toast('เบราว์เซอร์ไม่รองรับ GPS','err');return}
  navigator.geolocation.getCurrentPosition(p=>{$('s-lat').value=p.coords.latitude.toFixed(6);$('s-lng').value=p.coords.longitude.toFixed(6);toast('อ่านตำแหน่งปัจจุบันแล้ว — กดบันทึก','ok')},()=>toast('อ่านตำแหน่งไม่ได้ — เปิดสิทธิ์ Location','err'));
}
function saveSettings(){
  settings.company=$('s-company').value.trim();
  settings.address=$('s-address').value.trim();
  settings.lat=parseFloat($('s-lat').value)||null;
  settings.lng=parseFloat($('s-lng').value)||null;
  settings.radius=parseInt($('s-radius').value)||50;
  persist();updateGpsUI();toast('บันทึกการตั้งค่าแล้ว','ok');
}
async function geocodeAddress(){
  const addr=$('s-address').value.trim();
  const st=$('geo-status');
  if(!addr){toast('กรอกที่อยู่บริษัทก่อน','err');return}
  st.textContent='กำลังค้นหาพิกัดจากที่อยู่...';st.style.color='var(--muted)';
  try{
    // ลองหลายระดับ: ที่อยู่เต็ม → ตัดเลขที่/หมู่/ชื่ออาคาร → เฉพาะถนน+เขต+จังหวัด
    const toks=addr.split(/\s+/);
    const tries=[addr,
      toks.filter(t=>!/^\d|^เลขที่|^หมู่|^ม\.|^ซ\.|^ห้อง|^ชั้น|^อาคาร/.test(t)).join(' '),
      toks.filter(t=>/^ถ\.|^ถนน|^ต\.|^ตำบล|^แขวง|^อ\.|^อำเภอ|^เขต|^จ\.|^จังหวัด|กรุงเทพ|^\d{5}$/.test(t)).join(' '),
      toks.slice(-3).join(' ')
    ].filter((q,i,a)=>q&&a.indexOf(q)===i);
    let js=[];
    for(const q of tries){
      const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=th&q='+encodeURIComponent(q),{headers:{'Accept-Language':'th'}});
      js=await res.json();
      if(js.length)break;
    }
    if(!js.length){st.textContent='❌ ไม่พบพิกัดจากที่อยู่นี้ — ลองย่อที่อยู่ (เช่น ถนน+เขต+จังหวัด) หรือกรอกพิกัดเอง';st.style.color='var(--red)';return}
    $('s-lat').value=parseFloat(js[0].lat).toFixed(6);
    $('s-lng').value=parseFloat(js[0].lon).toFixed(6);
    st.textContent='✓ พบ: '+js[0].display_name.slice(0,90)+' — ตรวจสอบแล้วกด "บันทึกการตั้งค่า"';
    st.style.color='var(--green)';
    toast('ปักหมุดจากที่อยู่แล้ว — อย่าลืมกดบันทึก','ok');
  }catch(e){st.textContent='❌ ค้นหาไม่ได้ (ต้องต่ออินเทอร์เน็ต) — ใช้ปุ่ม 📌 ตำแหน่งปัจจุบัน หรือกรอกพิกัดเองแทน';st.style.color='var(--red)'}
}

/* ================= BOOT ================= */
sbLoad();
// deep-link สำหรับทดสอบ: ?as=EMP002&page=scan
const _qs=new URLSearchParams(location.search);
if(_qs.get('as')&&getUser(_qs.get('as'))){session={code:_qs.get('as')};persist()}
if(session&&getUser(session.code)){
  enterApp();
  const p=_qs.get('page');
  if(p&&PAGES.some(x=>x.id===p))go(p);
}
</script>
