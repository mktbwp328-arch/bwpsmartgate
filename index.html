<style>
:root{
  --navy:#0F2A52; --navy2:#0B1F3F; --blue:#1D6AE5; --blue-d:#1554BC;
  --green:#16A34A; --orange:#F97316; --purple:#7C3AED; --red:#DC2626;
  --bg:#EEF2F7; --card:#FFFFFF; --line:#E2E8F0; --line2:#F1F5F9;
  --text:#0F172A; --muted:#64748B; --faint:#94A3B8;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Thai','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;font-size:14px;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:600}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid #CBD5E1;border-radius:9px;padding:10px 13px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803D}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn-navy{background:var(--navy);color:#fff}
.badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;display:inline-block}
.b-green{background:#DCFCE7;color:#15803D}.b-yellow{background:#FEF9C3;color:#A16207}
.b-blue{background:#EFF5FF;color:#1D6AE5}.b-red{background:#FEE2E2;color:#B91C1C}
.b-purple{background:#F3E8FF;color:#7C3AED}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.hidden{display:none!important}
label{font-size:13px;font-weight:600;color:#334155;display:block;margin:0 0 5px}
.field{margin-bottom:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--line2);text-align:left;padding:11px 14px;font-size:12.5px;color:#475569}
td{padding:11px 14px;border-top:1px solid var(--line2)}
/* layout */
#app{display:flex;min-height:100vh}
#sidebar{width:230px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.side-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;font-size:14px;color:#C3D4EE;cursor:pointer;margin:2px 12px}
.side-item:hover{background:rgba(255,255,255,.08)}
.side-item.active{background:var(--blue);color:#fff;font-weight:600}
#main{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:#fff;border-bottom:1px solid var(--line)}
.page{padding:22px 26px}
.stat{border-radius:12px;padding:18px 20px;color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mobile-only{display:none}
@media(max-width:900px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}
  #sidebar{display:none}#mobilenav{display:flex!important}
  .mobile-only{display:flex!important}
  .topbar{flex-wrap:wrap;gap:10px;padding:12px 16px}
  #page-title{flex:1;min-width:0;font-size:17px!important}
  #status-group{flex-basis:100%}          /* ป้าย GPS ขึ้นบรรทัดใหม่เต็มแถว */
  #gps-indicator{font-size:11.5px;padding:7px 11px;line-height:1.35}
  .page{padding:16px 16px 110px}          /* เว้นที่ให้แถบเมนูล่าง */
  #main{min-width:0;overflow-x:hidden}
  table{font-size:12.5px}
}
#mobilenav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px 10px;justify-content:space-around}
#toast{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#0F172A;color:#fff;border-radius:10px;padding:12px 18px;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fadein .2s}
.toast.err{background:#B91C1C}.toast.ok{background:#15803D}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes bigin{from{transform:scale(.7)}to{transform:scale(1)}}
.modal-bg{position:fixed;inset:0;background:rgba(8,20,42,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.gps-pill{display:flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600}
.gps-ok{background:#DCFCE7;border:1px solid #86EFAC;color:#15803D}
.gps-bad{background:#FEE2E2;border:1px solid #FCA5A5;color:#B91C1C}
.gps-wait{background:#FEF9C3;border:1px solid #FDE047;color:#A16207}
.scan-frame{border-radius:14px;background:linear-gradient(160deg,#0B1F3F,#17335E);min-height:300px;position:relative;display:flex;align-items:center;justify-content:center;color:#A7C4EE;overflow:hidden}
.tab2{display:flex;gap:12px;margin-bottom:16px}
.tab2 button{flex-grow:1;padding:13px;font-size:15px;font-weight:700;border-radius:10px}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
</style>

<body>

  <div style="display:flex;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(6,18,40,.45);overflow:hidden;max-width:780px;width:100%;flex-wrap:wrap">

        <div id="pin-confirm-field" class="field hidden"><label>ยืนยันรหัส PIN อีกครั้ง</label><input id="login-pin2" type="password" placeholder="••••••" inputmode="numeric" maxlength="6" autocomplete="off"></div>

      <div style="font-size:12px;color:var(--faint);text-align:center;margin-top:14px">เข้าครั้งแรกให้ตั้งรหัส PIN ของตัวเอง · ลืมรหัสติดต่อฝ่ายบุคคล</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div style="display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)">
      <img src="bwp-logo.png" alt="BWP" style="width:40px;height:40px;border-radius:50%">
      <div><div style="font-size:16px;font-weight:700">BWP Smart Gate</div><div id="side-company" style="font-size:10.5px;color:#9DB8E0">Access Management</div></div>
    </div>
    <nav style="padding:12px 0;flex-grow:1" id="nav"></nav>

      <div id="me-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"></div>
      <div style="flex-grow:1;min-width:0"><div id="me-name" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div id="me-dept" style="font-size:11px;color:#9DB8E0"></div></div>

  <div id="main">

      <div id="page-title" style="font-size:19px;font-weight:700"></div>
      <div class="mobile-only" id="topbar-user" style="align-items:center;gap:8px;flex-shrink:0">
        <span id="me-name-m" style="font-size:12.5px;font-weight:600;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button onclick="logout()" style="background:#FEE2E2;color:#B91C1C;padding:12px 16px;font-size:13.5px;border-radius:9px;white-space:nowrap">⎋ ออก</button>
      </div>

        <span id="cloud-dot" title="สถานะซิงก์" style="width:10px;height:10px;border-radius:50%;background:#94A3B8;display:inline-block;flex-shrink:0"></span>
        <div id="gps-indicator" class="gps-pill gps-wait">📍 กำลังหาตำแหน่ง...</div>

<script>
/* ================= STATE ================= */
const LS='smartgate.';
const load=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};

/* ================= SUPABASE SYNC ================= */
const SB_URL='https://cpvlchkqazsdsiviajqg.supabase.co';
const SB_KEY='sb_publishable_xtX6DPBW88CB1SOdYvBwMw_hYjz9pJX';
let sbOnline=false;
async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',
    ...(opts.headers||{})}});
  if(!res.ok)throw new Error('sb '+res.status+' '+await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}
/* ---- ประวัติเข้า-ออก: เก็บเป็นตารางจริง (ถาวร ไม่ทับกัน) ---- */
let recTable=false;                                   // true = ใช้ตาราง smartgate_records ได้
const dayKey=(dt)=>{const d=dt||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toRow(r){return {emp_code:r.code,emp_name:r.name,dept:r.dept,work_date:r.date,day_key:r.dayKey||dayKey(),out_time:r.out||null,in_time:r.in||null}}
function fromRow(x){return {type:'emp',id:x.id,code:x.emp_code,name:x.emp_name,dept:x.dept,date:x.work_date,dayKey:x.day_key,out:x.out_time,in:x.in_time}}
async function recInsert(r){
  if(!recTable)return;
  try{
    const res=await sbFetch('smartgate_records',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify([toRow(r)])});
    if(res&&res[0])r.id=res[0].id;
  }catch(e){console.warn('บันทึกประวัติไม่สำเร็จ',e);toast('บันทึกประวัติขึ้นระบบไม่สำเร็จ','err')}
}
async function recUpdate(r){
  if(!recTable||!r.id)return;
  try{await sbFetch('smartgate_records?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({out_time:r.out||null,in_time:r.in||null,updated_at:new Date().toISOString()})});}
  catch(e){console.warn('อัปเดตประวัติไม่สำเร็จ',e);toast('อัปเดตประวัติขึ้นระบบไม่สำเร็จ','err')}
}
async function recLoadDay(k){   // โหลดรายการของวันหนึ่งมาไว้ใช้งาน (สถานะเข้า-ออกวันนี้)
  if(!recTable)return null;
  try{return (await sbFetch(`smartgate_records?day_key=eq.${k}&order=id.asc`)).map(fromRow)}catch(e){return null}
}
async function recDelete(id){
  if(!recTable)return false;
  try{await sbFetch('smartgate_records?id=eq.'+id,{method:'DELETE'});return true}
  catch(e){console.warn('ลบไม่สำเร็จ',e);toast('ลบไม่สำเร็จ — ตรวจสอบสิทธิ์ในฐานข้อมูล','err');return false}
}
async function recQuery(from,to,q){  // สำหรับหน้ารายงาน
  if(!recTable)return null;
  let url=`smartgate_records?day_key=gte.${from}&day_key=lte.${to}&order=day_key.desc,id.desc&limit=3000`;
  if(q)url+=`&or=(emp_name.ilike.*${encodeURIComponent(q)}*,emp_code.ilike.*${encodeURIComponent(q)}*,dept.ilike.*${encodeURIComponent(q)}*)`;
  try{return (await sbFetch(url)).map(fromRow)}catch(e){console.warn(e);return null}
}
let sbPending=0;
function sbPush(key,data){
  if(!sbOnline)return;
  sbPending++;
  sbFetch('smartgate_store?on_conflict=key',{method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{key,data,updated_at:new Date().toISOString()}])
  }).catch(e=>{console.warn('sync fail',e);toast('ซิงก์ไม่สำเร็จ — ข้อมูลถูกเก็บในเครื่องไว้ก่อน','err')})
    .finally(()=>{sbPending--});
}
async function sbLoad(force){
  if(sbPending>0)return; // กำลังอัปโหลดอยู่ — อย่าเพิ่งดึงทับ (กันข้อมูลที่เพิ่งบันทึกหาย)
  try{
    // เช็คก่อนว่ามีอะไรเปลี่ยนไหม (คิวรีเบา) ค่อยดึงข้อมูลเต็มซึ่งมีรูปถ่ายรวมอยู่ด้วย
    if(!force){
      const stamps=await sbFetch('smartgate_store?select=key,updated_at');
      const sig=stamps.map(r=>r.key+':'+r.updated_at).sort().join('|');
      if(sig===window._sbStamp){sbOnline=true;paintCloudDot();return}
      window._sbStamp=sig;
    }
    const rows=await sbFetch('smartgate_store?select=key,data');
    sbOnline=true;
    const m={};rows.forEach(r=>m[r.key]=r.data);
    const j=JSON.stringify(m);
    if(j===window._lastSync)return; // ไม่มีอะไรเปลี่ยน — ไม่ต้อง re-render (กันฟอร์มที่กำลังกรอกหาย)
    window._lastSync=j;
    // มีข้อมูลบนคลาวด์ → ใช้ของคลาวด์ / ยังไม่มี → อัปโหลดข้อมูลเครื่องนี้ขึ้นไปตั้งต้น
    if(m.employees)employees=m.employees;else sbPush('employees',employees);
    // ประวัติ: ใช้ตารางถ้ามี / ไม่มีก็ใช้ก้อน JSON แบบเดิม
    try{await sbFetch('smartgate_records?limit=1');recTable=true}catch(e){recTable=false}
    if(recTable){
      const rows=await recLoadDay(dayKey());
      if(rows){
        if(!m.records_migrated&&Array.isArray(m.records)&&m.records.length){ // ย้ายข้อมูลเดิมขึ้นตารางครั้งเดียว
          for(const r of m.records)await sbFetch('smartgate_records',{method:'POST',body:JSON.stringify([toRow(r)])}).catch(()=>{});
          sbPush('records_migrated',true);sbPush('records',[]);
          console.log('ย้ายประวัติเดิม '+m.records.length+' รายการขึ้นตารางแล้ว');
        }
        records=rows;
      }
    }else if(m.records)records=m.records;else sbPush('records',records);
    if(m.visitors)visitors=m.visitors;else sbPush('visitors',visitors);
    if(m.settings)settings={...settings,...m.settings};else sbPush('settings',settings);
    save('employees',employees);save('records',records);save('visitors',visitors);save('settings',settings);
    if($('app').classList.contains('hidden')){if(typeof bootSession==='function')bootSession()} // ข้อมูลเพิ่งมาถึง — ลองเข้าระบบอีกครั้ง
    else render();
    console.log('Supabase sync: online');
  }catch(e){sbOnline=false;console.warn('เชื่อมต่อฐานข้อมูลไม่ได้ — ใช้ข้อมูลในเครื่อง')}
  paintCloudDot();
}
function paintCloudDot(){
  const dot=$('cloud-dot');if(!dot)return;
  dot.style.background=sbOnline?'#22C55E':'#EAB308';
  dot.title=sbOnline?'ซิงก์ข้อมูลแล้ว':'ออฟไลน์ — ข้อมูลอยู่ในเครื่องเท่านั้น';
}
setInterval(()=>{if(sbOnline)sbLoad()},30000); // ดึงข้อมูลใหม่ทุก 30 วิ (คนอื่นแก้ก็เห็น)

let employees=load('employees',[]);
/* บทบาท: admin = เมนูเต็ม / guard = จุด รปภ. / emp = พนักงานทั่วไป */
function getRole(e){
  if(!e)return 'emp';
  if(e.code==='ADMIN')return 'admin'; // เข้าด้วยรหัส bwphradmin
  if(e.code==='SEC001'||/รปภ|รักษาความปลอดภัย/.test((e.dept||'')+(e.pos||'')))return 'guard';
  return 'emp';
}
function getUser(code){
  if(code==='ADMIN')return {code:'ADMIN',name:'ผู้ดูแลระบบ',dept:'BWP HR Admin',pos:'',phone:'',active:true};
  if(code==='SEC001'&&!employees.some(e=>e.code==='SEC001'))return {code:'SEC001',name:'จุดตรวจ รปภ.',dept:'รักษาความปลอดภัย',pos:'รปภ.',phone:'',active:true};
  return employees.find(e=>e.code===code);
}
let records=load('records',[]);   // {type:'emp', code, name, dept, in, out, date}
let visitors=load('visitors',[]);
const myDept=()=>{const e=getUser(session?.code);return e?e.dept:null};
// อนุมัติได้เมื่อ: เป็นแอดมิน/รปภ. หรือถูกกำหนดเป็นผู้อนุมัติของแผนกนั้น
const canApprove=v=>myRole!=='emp'||(settings.approvers?.[v.dept]||[]).includes(session?.code);// {id,name,addr,company,phone,contactCode,contactName,dept,purpose,photo,timeIn,status,timeOut}

function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dg=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ================= GPS ================= */
let gps={ok:false,dist:null,msg:'กำลังหาตำแหน่ง...'};
function updateGpsUI(){
  const el=$('gps-indicator');if(!el)return;
  if(settings.simulate){
    gps.ok=settings.simInRange;gps.dist=settings.simInRange?23:120;
    el.className='gps-pill '+(gps.ok?'gps-ok':'gps-bad');
    el.textContent=(gps.ok?'📍 อยู่ในรัศมี · ':'⛔ นอกรัศมี · ')+`ห่างหมุด ${gps.dist} ม. (จำลอง)`;
    return;
  }
  if(!settings.lat){el.className='gps-pill gps-wait';el.textContent='📍 ยังไม่ปักหมุดบริษัท — ไปที่ตั้งค่า';gps.ok=false;return}
  if(!navigator.geolocation){el.className='gps-pill gps-bad';el.textContent='⛔ เบราว์เซอร์ไม่รองรับ GPS';gps.ok=false;return}
  navigator.geolocation.getCurrentPosition(p=>{
    const d=Math.round(haversine(p.coords.latitude,p.coords.longitude,settings.lat,settings.lng));
    gps.dist=d;gps.ok=d<=settings.radius;
    el.className='gps-pill '+(gps.ok?'gps-ok':'gps-bad');
    el.textContent=(gps.ok?'📍 อยู่ในรัศมี · ':'⛔ นอกรัศมี · ')+`ห่างหมุด ${d} ม. (ไม่เกิน ${settings.radius} ม.)`;
  },e=>{el.className='gps-pill gps-bad';el.textContent='⛔ อ่านตำแหน่งไม่ได้ — เปิดสิทธิ์ Location';gps.ok=false});
}
setInterval(updateGpsUI,10000);

let pendingEmp=null,pinMode='enter'; // enter = กรอก PIN เดิม / set = ตั้งใหม่
async function hashPin(code,pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bwpsg:'+code+':'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loginErr(msg){const b=$('login-error');b.innerHTML=msg;b.classList.remove('hidden')}
function backToPhone(){

  $('btn-next').classList.remove('hidden');$('login-error').classList.add('hidden');
  $('login-pin').value='';$('login-pin2').value='';
}

  }

    box.classList.remove('hidden');toast('ไม่พบเบอร์นี้ในข้อมูลพนักงาน','err');return;
  }
  if(!found.active){
    box.innerHTML='<b>✕ ไม่สามารถเข้าระบบได้</b><br>บัญชีพนักงาน '+esc(found.code)+' ถูกระงับ (Inactive) — ติดต่อฝ่ายบุคคล';
    box.classList.remove('hidden');toast('บัญชีถูกระงับ (Inactive)','err');return;
  }

  $('pin-who').innerHTML=`<b>${esc(found.name)}</b> · ${esc(found.code)}${found.dept?' · '+esc(found.dept):''}`;
  $('pin-label').textContent=pinMode==='set'?'ตั้งรหัส PIN 6 หลัก (ใช้เข้าระบบครั้งต่อไป)':'รหัส PIN 6 หลัก';
  $('pin-confirm-field').classList.toggle('hidden',pinMode!=='set');
  $('pin-box').classList.remove('hidden');
  $('btn-next').classList.add('hidden');
  $('btn-login').classList.remove('hidden');$('btn-back').classList.remove('hidden');
  $('btn-login').textContent=pinMode==='set'?'ตั้งรหัสและเข้าสู่ระบบ →':'เข้าสู่ระบบ →';
  $('login-pin').focus();
};
$('login-pin').onkeydown=e=>{if(e.key==='Enter')pinMode==='set'?$('login-pin2').focus():$('btn-login').click()};

$('login-phone').onkeydown=e=>{if(e.key==='Enter')$('btn-next').click()};
$('btn-login').onclick=async()=>{
  const pin=$('login-pin').value.trim();
  $('login-error').classList.add('hidden');
  if(!/^\d{6}$/.test(pin)){loginErr('รหัส PIN ต้องเป็นตัวเลข 6 หลัก');return}
  if(pinMode==='set'){
    if(pin!==$('login-pin2').value.trim()){loginErr('รหัส PIN ทั้งสองช่องไม่ตรงกัน');return}
    if(/^(\d)\1{5}$/.test(pin)||['123456','654321','012345'].includes(pin)){loginErr('รหัส PIN คาดเดาง่ายเกินไป — เลือกเลขอื่น');return}
    const emp=employees.find(e=>e.code===pendingEmp.code);
    emp.pinHash=await hashPin(emp.code,pin);
    session={code:emp.code,at:Date.now()};persist();enterApp();
    toast('ตั้งรหัส PIN เรียบร้อย — ครั้งต่อไปใช้รหัสนี้เข้าระบบ','ok');return;
  }
  const lock=lockState(pendingEmp.code);
  if(lock.until>Date.now()){loginErr(`<b>✕ ถูกล็อกชั่วคราว</b><br>กรอกรหัสผิดหลายครั้ง — ลองใหม่ในอีก ${Math.ceil((lock.until-Date.now())/60000)} นาที`);return}
  const h=await hashPin(pendingEmp.code,pin);
  if(h!==pendingEmp.pinHash){
    lock.n=(lock.n||0)+1;
    if(lock.n>=5){lock.until=Date.now()+15*60000;lock.n=0;saveLock(pendingEmp.code,lock);
      loginErr('<b>✕ กรอกรหัสผิดครบ 5 ครั้ง</b><br>ถูกล็อก 15 นาที — หากลืมรหัสให้ติดต่อฝ่ายบุคคล');return}
    saveLock(pendingEmp.code,lock);
    loginErr('รหัส PIN ไม่ถูกต้อง (ผิด '+lock.n+'/5 ครั้ง)');
    $('login-pin').value='';$('login-pin').focus();return;
  }
  saveLock(pendingEmp.code,{n:0,until:0});
  session={code:pendingEmp.code,at:Date.now()};persist();enterApp();
};
/* ล็อกเก็บใน localStorage — รีเฟรชหน้าแล้วไม่รีเซ็ตจำนวนครั้งที่ผิด */
function lockState(code){try{return JSON.parse(localStorage.getItem(LS+'lock.'+code))||{n:0,until:0}}catch(e){return {n:0,until:0}}}
function saveLock(code,v){try{localStorage.setItem(LS+'lock.'+code,JSON.stringify(v))}catch(e){}}
function logout(){
  if(!confirm('ออกจากระบบ?'))return;
  doLogout();
}
function doLogout(msg){
  session=null;persist();
  if(msg)try{sessionStorage.setItem('logoutMsg',msg)}catch(e){}
  location.replace(location.pathname); // ล้าง ?as= ออกด้วย ไม่งั้นเข้าซ้ำอัตโนมัติ
}
/* ---- หมดอายุการเข้าใช้งาน: กันเครื่องส่วนกลาง (จุด รปภ. / มือถือที่วางทิ้งไว้) ---- */
const SESSION_MAX_H=12;        // เข้าระบบได้นานสุด 12 ชั่วโมง
const IDLE_LOGOUT_MIN=30;      // ไม่มีการใช้งาน 30 นาที ออกอัตโนมัติ
let lastAct=Date.now();
['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{
  if(!session||$('app').classList.contains('hidden'))return;
  if(session.at&&Date.now()-session.at>SESSION_MAX_H*3600e3)return doLogout('เข้าระบบครบ '+SESSION_MAX_H+' ชั่วโมงแล้ว กรุณาเข้าสู่ระบบใหม่');
  if(Date.now()-lastAct>IDLE_LOGOUT_MIN*60000)return doLogout('ไม่มีการใช้งาน '+IDLE_LOGOUT_MIN+' นาที ระบบออกให้อัตโนมัติ');
},60000);

/* ---- ตัวช่วยของแดชบอร์ด (กรอง วัน / เดือน / ปี) ---- */
const nowD=new Date();
let dashMode=load('dashMode','day'),
    dashDay=load('dashDay',dayKey()),
    dashMonth=load('dashMonth',dayKey().slice(0,7)),
    dashYear=load('dashYear',String(nowD.getFullYear())),
    dashRows=null,dashChart=null,dashFocusKey=null;
function dashSave(){save('dashMode',dashMode);save('dashDay',dashDay);save('dashMonth',dashMonth);save('dashYear',dashYear)}
function dashRange(){
  if(dashMode==='day')return [dashDay,dashDay];
  if(dashMode==='month'){const [y,m]=dashMonth.split('-').map(Number);const last=new Date(y,m,0).getDate();return [`${dashMonth}-01`,`${dashMonth}-${String(last).padStart(2,'0')}`]}
  return [`${dashYear}-01-01`,`${dashYear}-12-31`];
}
function dashBar(){
  const btn=(m,t)=>`<button onclick="dashSetMode('${m}')" style="padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:${dashMode===m?700:500};background:${dashMode===m?'var(--blue)':'transparent'};color:${dashMode===m?'#fff':'var(--muted)'}">${t}</button>`;
  const picker=dashMode==='day'
    ? `<input type="date" id="dash-day" value="${dashDay}" style="width:auto" onchange="dashDay=this.value;dashApply()">`
    : dashMode==='month'
    ? `<input type="month" id="dash-month" value="${dashMonth}" style="width:auto" onchange="dashMonth=this.value;dashApply()">`
    : `<select id="dash-year" style="width:auto" onchange="dashYear=this.value;dashApply()">${Array.from({length:6},(_,i)=>nowD.getFullYear()-i).map(y=>`<option value="${y}" ${String(y)===dashYear?'selected':''}>ปี ${y+543} (${y})</option>`).join('')}</select>`;
  return `<div class="card" style="padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;gap:4px;background:var(--line2);border-radius:11px;padding:3px">${btn('day','รายวัน')}${btn('month','รายเดือน')}${btn('year','รายปี')}</div>
    ${picker}
    ${dashMode==='day'?`<button class="btn-ghost" style="padding:8px 14px;font-size:12.5px" onclick="dashDay=dayKey();dashApply()">วันนี้</button>`:''}
    <div style="flex-grow:1"></div>
    <span style="font-size:12.5px;color:var(--muted)">${dashMode==='day'?'📅 '+(dashDay===dayKey()?esc(fullDate()):esc(new Date(dashDay+'T00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))):dashMode==='month'?'📅 '+esc(new Date(dashMonth+'-01T00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'})):'📅 ปี '+(Number(dashYear)+543)}</span>
    <button class="btn-ghost" onclick="dashReload()" style="padding:8px 14px;font-size:12.5px">↻ รีเฟรช</button>
  </div>`;
}
function dashSetMode(m){dashMode=m;dashSave();dashApply()}
function dashApply(){dashSave();dashRows=null;dashChart=null;render()}
function dashToReport(){const [f,t]=dashRange();repFrom=f;repTo=t;repQ='';repRows=null;reportTab='emp';save('reportTab','emp');repSave();go('report')}
function minsSince(hhmm){if(!hhmm)return 0;const [h,m]=hhmm.split(':').map(Number);const n=new Date();return (n.getHours()*60+n.getMinutes())-(h*60+m)}
function fmtDur(m){if(m<0)m=0;const h=Math.floor(m/60),x=m%60;return h?`${h} ชม. ${x} น.`:`${x} นาที`}
function dashFocus(k){dashFocusKey=k;render();const el=document.querySelector('#pages .grid2');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
function dashPickDay(k){dashMode='day';dashDay=k;dashApply()}
function dashPickMonth(k){dashMode='month';dashMonth=k;dashApply()}
async function dashReload(){dashRows=null;dashChart=null;render();await sbLoad();await loadDash();render();toast('อัปเดตข้อมูลแล้ว','ok')}
async function loadDash(){
  const [f,t]=dashRange();
  dashRows=await recQuery(f,t,'')||records.filter(r=>!r.dayKey||(r.dayKey>=f&&r.dayKey<=t));
  // ---- ชุดข้อมูลกราฟ ----
  if(dashMode==='year'){
    const ms=Array.from({length:12},(_,i)=>{const key=`${dashYear}-${String(i+1).padStart(2,'0')}`;
      return {key,label:new Date(dashYear+'-'+String(i+1).padStart(2,'0')+'-01T00:00').toLocaleDateString('th-TH',{month:'long'}),short:new Date(dashYear+'-'+String(i+1).padStart(2,'0')+'-01T00:00').toLocaleDateString('th-TH',{month:'short'}),outs:0,ins:0,click:`dashPickMonth('${key}')`}});
    dashRows.forEach(r=>{const m=ms.find(x=>r.dayKey&&r.dayKey.startsWith(x.key));if(m){if(r.out)m.outs++;if(r.in)m.ins++}});
    dashChart=ms;
  }else if(dashMode==='month'){
    const [y,mo]=dashMonth.split('-').map(Number);const last=new Date(y,mo,0).getDate();
    const ds=Array.from({length:last},(_,i)=>{const key=`${dashMonth}-${String(i+1).padStart(2,'0')}`;
      return {key,label:key,short:String(i+1),outs:0,ins:0,click:`dashPickDay('${key}')`}});
    dashRows.forEach(r=>{const dd=ds.find(x=>x.key===r.dayKey);if(dd){if(r.out)dd.outs++;if(r.in)dd.ins++}});
    dashChart=ds;
  }else{
    const base=new Date(dashDay+'T00:00');const days=[];
    for(let i=6;i>=0;i--){const dt=new Date(base);dt.setDate(dt.getDate()-i);
      days.push({key:dayKey(dt),label:dt.toLocaleDateString('th-TH',{day:'numeric',month:'short'}),short:dt.toLocaleDateString('th-TH',{day:'numeric',month:'short'}),outs:0,ins:0,click:`dashPickDay('${dayKey(dt)}')`})}
    const wk=await recQuery(days[0].key,days[6].key,'')||records;
    wk.forEach(r=>{const dd=days.find(x=>x.key===r.dayKey);if(dd){if(r.out)dd.outs++;if(r.in)dd.ins++}});
    dashChart=days;
  }
}
setInterval(()=>{if(cur==='dash'&&dashMode==='day'&&dashDay===dayKey()&&!$('app').classList.contains('hidden'))render()},60000);

function resetPin(code){
  const e=employees.find(x=>x.code===code);
  if(!e.pinHash){toast(e.code+' ยังไม่ได้ตั้ง PIN','err');return}
  if(!confirm('รีเซ็ตรหัส PIN ของ '+e.name+' ?\nพนักงานจะตั้งรหัสใหม่เองตอนล็อกอินครั้งถัดไป'))return;
  delete e.pinHash;persist();renderEmpTable();

function toggleEmp(code){const e=employees.find(x=>x.code===code);e.active=!e.active;persist();renderEmpTable();toast(`${e.code} → ${e.active?'Active พร้อมใช้งานที่จุดสแกน':'Inactive'}`,'ok')}
function delEmp(code){if(!confirm('ลบพนักงาน '+code+' ?'))return;employees=employees.filter(e=>e.code!==code);persist();renderEmpTable()}
function empModal(code){
  const e=employees.find(x=>x.code===code)||{code:'',name:'',dept:'',pos:'',phone:'',active:true};
  $('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">

  </div></div>`;

function closeModal(){$('modal-root').innerHTML=''}
function saveEmp(code){
  const v=id=>$(id).value.trim();
  if(!v('f-code')||!v('f-name')||!v('f-phone')){toast('กรอกรหัส ชื่อ และเบอร์โทรให้ครบ','err');return}
  if(!code&&employees.some(e=>e.code===v('f-code'))){toast('รหัสนี้มีอยู่แล้ว','err');return}
  const data={code:v('f-code'),name:v('f-name'),dept:v('f-dept'),pos:v('f-pos'),phone:v('f-phone'),active:true};
  if(code){Object.assign(employees.find(e=>e.code===code),data)}else{employees.push(data)}
  persist();closeModal();renderEmpTable();toast('บันทึกแล้ว — สถานะ Active พร้อมใช้งานที่จุดสแกน','ok');
}
function importCsv(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  let retried=false;
  rd.onload=()=>{
    // CSV จาก Excel ไทยมักเป็นรหัส windows-874 — ถ้าอ่านแล้วตัวอักษรเพี้ยน (�) ให้อ่านใหม่
    if(!retried&&rd.result.includes('�')){retried=true;rd.readAsText(f,'windows-874');return}
    let n=0;
    rd.result.split(/\r?\n/).forEach(line=>{
      const c=line.split(',').map(s=>s.trim());
      if(c.length>=2&&c[0]&&!/รหัส/.test(c[0])&&!employees.some(e=>e.code===c[0])){
        employees.push({code:c[0],name:c[1]||'',dept:c[2]||'',pos:c[3]||'',phone:c[4]||'',active:true});n++;
      }});
    persist();renderEmpTable();toast(`นำเข้าแล้ว ${n} รายการ`,'ok');inp.value='';
  };
  rd.readAsText(f);
}

/* ================= MY SCAN (พนักงาน) ================= */
/* 1 record = 1 รอบการออกไปข้างนอก: ออกก่อน แล้วเข้าทีหลัง
   - {out:เวลาออก, in:null}      = ออกไปแล้ว ยังไม่กลับเข้ามา
   - {out:เวลาออก, in:เวลากลับ}  = ออกแล้วกลับเข้ามาครบรอบ
   - {out:null, in:เวลาเข้า}     = เข้าโดยไม่ได้เช็คออก
   - ออกแล้วไม่กลับ ข้ามวันรีเซ็ตใหม่ เพราะ record ผูกกับวันที่ */
function dayEvents(code,d){return records.filter(r=>r.code===code&&r.date===(d||today()))}
function openOuting(code,d){const e=dayEvents(code,d);for(let i=e.length-1;i>=0;i--)if(e[i].out&&!e[i].in)return e[i];return null}
function isOutside(code,d){return !!openOuting(code,d)}
function summarizeDay(code,d){
  const e=dayEvents(code,d);
  if(!e.length)return 'ยังไม่มีรายการวันนี้';
  return e.map(r=>r.out&&r.in?`ออก ${r.out} → เข้า ${r.in}`:r.out?`ออก ${r.out} → (ยังไม่กลับ)`:`เข้า ${r.in} (ไม่ได้เช็คออก)`).join(' · ');
}
let myMode='out'; // ตั้งต้นที่ "เช็คออก" เพื่อจับคนออกไปข้างนอกระหว่างวัน

let idcardData=null,vphotoData=null;
function shrink(dataUrl,maxW,q){   // ย่อรูปก่อนเก็บ (พื้นที่จำกัด)
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,maxW/img.width);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
function onVPhoto(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    vphotoData=await shrink(rd.result,360,0.72);
    $('vphoto-box').innerHTML=`<img src="${vphotoData}" style="width:100%;height:100%;object-fit:cover">`;
    toast('บันทึกรูปผู้มาติดต่อแล้ว','ok');
  };
  rd.readAsDataURL(f);
}
/* ---- เก็บรูปบัตรประชาชนไว้อ้างอิง (ไม่มีการอ่านอัตโนมัติ กรอกข้อมูลเอง) ---- */
function onIdCard(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    idcardData=await shrink(rd.result,900,0.75);
    const img=$('idcard-preview');img.src=idcardData;img.classList.remove('hidden');
    const n=$('ocr-note');if(n){n.textContent='✓ บันทึกรูปบัตรแล้ว — กรอกชื่อและที่อยู่ด้านล่าง';n.style.color='var(--green)'}
    toast('บันทึกรูปบัตรประชาชนแล้ว','ok');
  };
  rd.readAsDataURL(f);
}
/* แผนกที่เปิดให้ผู้มาติดต่อเลือก + ผู้ที่อนุมัติได้ในแผนกนั้น (กำหนดในหน้าตั้งค่า) */

function saveVisitor(){
  const v=id=>$(id).value.trim();
  if(!v('v-name')||!v('v-addr')){toast('กรอกชื่อและที่อยู่ให้ครบ','err');return}
  const dept=$('v-dept').value;
  if(!dept){toast('เลือกแผนกที่ต้องการติดต่อ','err');return}
  visitors.push({id:Date.now(),name:v('v-name'),addr:v('v-addr'),company:v('v-company'),phone:v('v-phone'),
    dept,contactName:null,contactCode:null,purpose:v('v-purpose'),
    photo:vphotoData,idcard:idcardData,
    timeIn:nowTime(),date:today(),dayKey:dayKey(),status:'กำลังติดต่อ',timeOut:null,approvedBy:null});
  idcardData=null;vphotoData=null;persist();render();
  toast(`บันทึกแล้ว — ส่งแจ้งเตือนไปยังแผนก${dept}`,'ok');
}
function reqOut(id){const v=visitors.find(x=>x.id===id);v.status='รออนุมัติออก';persist();render();toast(`ส่งขออนุมัติออกไปยังแผนก${v.dept} แล้ว`,'ok')}

/* ---- ตัวกรองช่วงวันที่ของหน้ารายงาน ---- */
let repFrom=load('repFrom',null),repTo=load('repTo',null),repQ=load('repQ',''),repRows=null,repLoading=false;
function repDefaults(){if(!repTo){const n=new Date();repTo=dayKey(n);const s=new Date(n);s.setDate(s.getDate()-30);repFrom=dayKey(s)}}
function repSave(){save('repFrom',repFrom);save('repTo',repTo);save('repQ',repQ)}   // จำตัวกรองไว้ตอนรีเฟรช
async function repLoad(){
  repDefaults();
  repFrom=$('rep-from')?.value||repFrom;repTo=$('rep-to')?.value||repTo;repQ=$('rep-q')?.value.trim()||'';
  repSave();
  repLoading=true;render();
  const rows=await recQuery(repFrom,repTo,repQ);
  repRows=rows||records.filter(r=>{const q=repQ.toLowerCase();return !q||[r.code,r.name,r.dept].join(' ').toLowerCase().includes(q)});
  repLoading=false;render();
}
function repBar(kind){
  repDefaults();
  const vis=kind==='vis';
  return `<div class="card" style="padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:13px;font-weight:600;color:#334155">วันที่</span>
    <input type="date" id="rep-from" value="${repFrom}" style="width:auto">
    <span style="color:var(--muted)">-</span>
    <input type="date" id="rep-to" value="${repTo}" style="width:auto">
    <input id="rep-q" value="${esc(repQ)}" placeholder="${vis?'🔍 ค้นหาชื่อ / บริษัท / ผู้ถูกติดต่อ':'🔍 ค้นหาชื่อ / รหัส / แผนก'}" style="flex-grow:1;min-width:180px" onkeydown="if(event.key==='Enter')${vis?'repApplyVis()':'repLoad()'}">
    <button class="btn-blue" onclick="${vis?'repApplyVis()':'repLoad()'}">ค้นหา</button>
    ${!vis&&!recTable?'<span style="font-size:12px;color:#A16207">⚠ ยังไม่ได้สร้างตารางประวัติ — แสดงเฉพาะข้อมูลในระบบเดิม</span>':''}

}
function repApplyVis(){
  repFrom=$('rep-from').value||repFrom;repTo=$('rep-to').value||repTo;repQ=$('rep-q').value.trim();
  repSave();render();
}
async function delRecord(id){
  if(id==null){toast('รายการนี้ยังไม่ถูกบันทึกลงฐานข้อมูล','err');return}
  const r=(repRows||records).find(x=>x.id===id);
  if(!confirm(`ลบรายการนี้?\n${r?.name||''} · ${r?.date||''}\nออก ${r?.out||'-'} · เข้า ${r?.in||'-'}\n\nลบแล้วกู้คืนไม่ได้`))return;
  if(!await recDelete(id))return;
  if(repRows)repRows=repRows.filter(x=>x.id!==id);
  records=records.filter(x=>x.id!==id);
  save('records',records);dashRows=null;dashChart=null;render();
  toast('ลบรายการแล้ว','ok');
}
async function delRangeRecords(){
  const rows=(repRows||[]).filter(r=>r.id!=null);
  if(!rows.length){toast('ไม่มีรายการให้ลบ','err');return}
  if(!confirm(`ลบทั้งหมด ${rows.length} รายการที่แสดงอยู่?\nช่วงวันที่ ${repFrom} ถึง ${repTo}${repQ?' · คำค้น "'+repQ+'"':''}\n\nลบแล้วกู้คืนไม่ได้`))return;
  if(prompt('พิมพ์ ลบ เพื่อยืนยัน')!=='ลบ'){toast('ยกเลิกการลบ','err');return}
  let n=0;for(const r of rows){if(await recDelete(r.id))n++}
  const ids=new Set(rows.map(r=>r.id));
  repRows=repRows.filter(r=>!ids.has(r.id));
  records=records.filter(r=>!ids.has(r.id));
  save('records',records);dashRows=null;dashChart=null;render();
  toast(`ลบแล้ว ${n} รายการ`,'ok');
}

function reportVis(){
  repDefaults();
  const q=repQ.toLowerCase();
  const rows=visitors.slice().reverse().filter(v=>{
    const k=v.dayKey||(v.id>1e12?dayKey(new Date(v.id)):null);   // รายการเก่า: ดึงวันที่จาก id (timestamp)
    if(k&&(k<repFrom||k>repTo))return false;
    return !q||[v.name,v.company,v.approvedBy,v.dept,v.purpose,v.phone].join(' ').toLowerCase().includes(q);
  });
  window._visRows=rows;
  return repBar('vis')+`<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">พบ ${rows.length} รายการ</div>

function reportDaily(){
  if(repRows===null&&!repLoading){setTimeout(repLoad,0);return repBar()+'<div class="card" style="padding:40px;text-align:center;color:var(--faint)">กำลังโหลด...</div>'}
  if(repLoading)return repBar()+'<div class="card" style="padding:40px;text-align:center;color:var(--faint)">กำลังโหลด...</div>';
  const days={};
  repRows.forEach(r=>{const d=days[r.date]=days[r.date]||{ins:0,outs:0,notBack:0,noOut:0,vis:0};
    if(r.out)d.outs++;if(r.in)d.ins++;
    if(r.out&&!r.in)d.notBack++;
    if(!r.out&&r.in)d.noOut++;});
  visitors.forEach(v=>{const d=days[v.date]=days[v.date]||{ins:0,outs:0,late:0,inside:0,vis:0};d.vis++});
  const keys=Object.keys(days).reverse();
  return repBar()+`<div class="card" style="overflow-x:auto"><table>
    <tr><th>วันที่</th><th>เช็คออก (ครั้ง)</th><th>เช็คเข้า (ครั้ง)</th><th>ออกแล้วไม่กลับ</th><th>เข้าไม่เช็คออก</th><th>ผู้มาติดต่อ</th></tr>
    ${keys.map(k=>{const d=days[k];return `<tr><td style="font-weight:600">${esc(k)}</td><td>${d.outs}</td><td>${d.ins}</td>
      <td>${d.notBack?`<span class="badge b-red">${d.notBack} ครั้ง</span>`:'-'}</td>
      <td>${d.noOut?`<span class="badge b-yellow">${d.noOut} ครั้ง</span>`:'-'}</td><td>${d.vis||'-'}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--faint);padding:30px">ยังไม่มีข้อมูล</td></tr>'}
  </table></div>`;
}

      <button class="btn-green" onclick="exportCsv('vis')">⬇️ ส่งออก CSV</button>

function exportCsv(kind){
  let head,lines,fname;
  if(kind==='vis'){
    head='วันที่,ชื่อ,บริษัท,แผนกที่ติดต่อ,ผู้อนุมัติออก,วัตถุประสงค์,เวลาเข้า,เวลาออก,สถานะ';
    lines=visitors.map(v=>[v.date,v.name,v.company||'',v.dept,v.approvedBy||'',v.purpose||'',v.timeIn||'',v.timeOut||'',v.status]);
    fname='bwp-visitors.csv';
  }else{
    head='วันที่,รหัสพนักงาน,ชื่อ,แผนก,เวลาออก,เวลากลับเข้า,สถานะ';
    lines=(repRows||records).map(r=>[r.date,r.code,r.name,r.dept,r.out||'',r.in||'',!r.out?'เข้าโดยไม่ได้เช็คออก':r.in?'กลับเข้าแล้ว':'ยังไม่กลับเข้า']);
    fname='bwp-attendance.csv';
  }
  const csv='﻿'+[head,...lines.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fname;a.click();
}

/* ---- จัดการแผนกและผู้อนุมัติ ---- */
function addDept(){
  const d=$('new-dept').value.trim();
  if(!d){toast('พิมพ์ชื่อแผนกก่อน','err');return}
  settings.approvers=settings.approvers||{};
  if(settings.approvers[d]){toast('มีแผนกนี้อยู่แล้ว','err');return}
  settings.approvers[d]=[];persist();render();toast('เพิ่มแผนก '+d+' แล้ว — อย่าลืมกำหนดผู้อนุมัติ','ok');
}
function delDept(d){
  if(!confirm('ลบแผนก "'+d+'" ออกจากรายการ?\nรปภ. จะเลือกแผนกนี้ไม่ได้อีก (ข้อมูลผู้มาติดต่อเดิมยังอยู่)'))return;
  delete settings.approvers[d];persist();render();toast('ลบแผนกแล้ว','ok');
}
function addApprover(d){
  const c=$('add-'+d).value;
  if(!c){toast('เลือกพนักงานก่อน','err');return}
  settings.approvers[d]=[...(settings.approvers[d]||[]),c];
  persist();render();toast('เพิ่มผู้อนุมัติแล้ว','ok');
}
function delApprover(d,c){
  settings.approvers[d]=(settings.approvers[d]||[]).filter(x=>x!==c);
  persist();render();toast('นำออกจากผู้อนุมัติแล้ว','ok');
}
function restoreCompanyPin(){
  $('s-company').value=COMPANY_PIN.company;$('s-address').value=COMPANY_PIN.address;
  $('s-lat').value=COMPANY_PIN.lat;$('s-lng').value=COMPANY_PIN.lng;$('s-radius').value=COMPANY_PIN.radius;
  saveSettings();toast('คืนค่าหมุดบริษัทเรียบร้อย','ok');
}
function pinHere(){
  if(!navigator.geolocation){toast('เบราว์เซอร์ไม่รองรับ GPS','err');return}
  navigator.geolocation.getCurrentPosition(p=>{$('s-lat').value=p.coords.latitude.toFixed(6);$('s-lng').value=p.coords.longitude.toFixed(6);toast('อ่านตำแหน่งปัจจุบันแล้ว — กดบันทึก','ok')},()=>toast('อ่านตำแหน่งไม่ได้ — เปิดสิทธิ์ Location','err'));
}
function saveSettings(){
  settings.company=$('s-company').value.trim();
  settings.address=$('s-address').value.trim();
  settings.lat=parseFloat($('s-lat').value)||null;
  settings.lng=parseFloat($('s-lng').value)||null;
  settings.radius=parseInt($('s-radius').value)||50;
  persist();updateGpsUI();toast('บันทึกการตั้งค่าแล้ว','ok');
}
async function geocodeAddress(){
  const addr=$('s-address').value.trim();
  const st=$('geo-status');
  if(!addr){toast('กรอกที่อยู่บริษัทก่อน','err');return}
  st.textContent='กำลังค้นหาพิกัดจากที่อยู่...';st.style.color='var(--muted)';
  try{
    // ลองหลายระดับ: ที่อยู่เต็ม → ตัดเลขที่/หมู่/ชื่ออาคาร → เฉพาะถนน+เขต+จังหวัด
    const toks=addr.split(/\s+/);
    const tries=[addr,
      toks.filter(t=>!/^\d|^เลขที่|^หมู่|^ม\.|^ซ\.|^ห้อง|^ชั้น|^อาคาร/.test(t)).join(' '),
      toks.filter(t=>/^ถ\.|^ถนน|^ต\.|^ตำบล|^แขวง|^อ\.|^อำเภอ|^เขต|^จ\.|^จังหวัด|กรุงเทพ|^\d{5}$/.test(t)).join(' '),
      toks.slice(-3).join(' ')
    ].filter((q,i,a)=>q&&a.indexOf(q)===i);
    let js=[];
    for(const q of tries){
      const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=th&q='+encodeURIComponent(q),{headers:{'Accept-Language':'th'}});
      js=await res.json();
      if(js.length)break;
    }
    if(!js.length){st.textContent='❌ ไม่พบพิกัดจากที่อยู่นี้ — ลองย่อที่อยู่ (เช่น ถนน+เขต+จังหวัด) หรือกรอกพิกัดเอง';st.style.color='var(--red)';return}
    $('s-lat').value=parseFloat(js[0].lat).toFixed(6);
    $('s-lng').value=parseFloat(js[0].lon).toFixed(6);
    st.textContent='✓ พบ: '+js[0].display_name.slice(0,90)+' — ตรวจสอบแล้วกด "บันทึกการตั้งค่า"';
    st.style.color='var(--green)';
    toast('ปักหมุดจากที่อยู่แล้ว — อย่าลืมกดบันทึก','ok');
  }catch(e){st.textContent='❌ ค้นหาไม่ได้ (ต้องต่ออินเทอร์เน็ต) — ใช้ปุ่ม 📌 ตำแหน่งปัจจุบัน หรือกรอกพิกัดเองแทน';st.style.color='var(--red)'}
}

// deep-link สำหรับทดสอบ: ?as=EMP002&page=scan
const _qs=new URLSearchParams(location.search);
function bootSession(){
  if(_qs.get('as')&&getUser(_qs.get('as'))){session={code:_qs.get('as')};persist()}
  if(session&&getUser(session.code)){
    enterApp();
    const p=_qs.get('page');
    if(p&&PAGES.some(x=>x.id===p))go(p);
    if(_qs.get('demo')&&cur==='myscan'){myMode=_qs.get('demo');setTimeout(doMyScan,300)} // สำหรับดูตัวอย่างหน้าจอ
    return true;
  }
  return false;
}
// เซสชันหมดอายุ ให้ลบทิ้งก่อนเข้าระบบ
if(session&&session.at&&Date.now()-session.at>SESSION_MAX_H*3600e3){session=null;persist()}
try{const m=sessionStorage.getItem('logoutMsg');if(m){sessionStorage.removeItem('logoutMsg');setTimeout(()=>toast(m,'err'),400)}}catch(e){}
bootSession();
</script>
